complexity:
    LongMethod:
        allowedLines: 150
        ignoreAnnotated: [ 'Composable' ]
    CyclomaticComplexMethod:
        allowedComplexity: 43
        ignoreAnnotated: [ 'Composable' ]
    LongParameterList:
        active: false
    TooManyFunctions:
        active: false
    ComplexCondition:
        allowedConditions: 7

performance:
    SpreadOperator:
        active: false

ktlint:
    TrailingCommaOnCallSite:
        active: true
    TrailingCommaOnDeclarationSite:
        active: true
    ImportOrdering:
        active: false
    MaximumLineLength:
        active: false
    MultiLineIfElse:
        active: false
    Indentation:
        indentSize: 4
    ParameterListWrapping:
        active: false
    PropertyWrapping:
        maxLineLength: 150
    ArgumentListWrapping:
        indentSize: 4
        maxLineLength: 150
    KdocWrapping:
        active: true
        indentSize: 4
    Wrapping:
        indentSize: 4
        active: false
    CommentWrapping:
        active: false
    Filename:
        active: false
    PackageName:
        active: false
    AnnotationOnSeparateLine:
        active: false
    # Keep the 1.x rule selection while migrating the build tools.
    BackingPropertyNaming:
        active: false
    BinaryExpressionWrapping:
        active: false
    BlankLineBetweenWhenConditions:
        active: false
    ClassSignature:
        active: false
    ConditionWrapping:
        active: false
    ContextReceiverListWrapping:
        active: false
    ContextReceiverMapping:
        active: false
    EnumWrapping:
        active: false
    FunctionExpressionBody:
        active: false
    FunctionLiteral:
        active: false
    FunctionSignature:
        active: false
    FunctionTypeModifierSpacing:
        active: false
    Kdoc:
        active: false
    MixedConditionOperators:
        active: false
    MultilineLoop:
        active: false
    NoEmptyFile:
        active: false
    ParameterListSpacing:
        active: false
    PropertyName:
        active: false
    SpacingAroundSquareBrackets:
        active: false
    StatementWrapping:
        active: false
    ThenSpacing:
        active: false
    TypeArgumentComment:
        active: false
    TypeArgumentListSpacing:
        active: false
    TypeParameterComment:
        active: false
    TypeParameterListSpacing:
        active: false
    ValueArgumentComment:
        active: false
    ValueParameterComment:
        active: false

exceptions:
    TooGenericExceptionCaught:
        active: false
    SwallowedException:
        active: false

style:
    ExplicitItLambdaMultipleParameters:
        active: false
    FunctionOnlyReturningConstant:
        active: false
    UnusedParameter:
        active: false
    MagicNumber:
        active: false
        ignoreAnnotated: [ 'AllowMagicNumber' ]
    ForbiddenComment:
        active: false
    UnusedPrivateFunction:
        ignoreAnnotated: [ 'Preview', 'ComponentPreview', 'DevicePreview' ]
    UnusedPrivateProperty:
        ignoreAnnotated: [ 'Preview', 'ComponentPreview', 'DevicePreview' ]
    ThrowsCount:
        active: false
    ReturnCount:
        active: false
    LoopWithTooManyJumpStatements:
        active: false
    DestructuringDeclarationWithTooManyEntries:
        active: false
    MaxLineLength:
        active: false

naming:
    TopLevelPropertyNaming:
        constantPattern: '[A-Z][A-Za-z0-9_]*'
    FunctionNaming:
        ignoreAnnotated: [ 'Composable' ]
    MatchingDeclarationName:
        active: false
    VariableNaming:
        active: false
    PackageNaming:
        packagePattern: '[a-z]+(\._?[_?A-Za-z0-9]*)*'

name: Deploy Play Store Production

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Validate release version and notes
        env:
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          RELEASE_BASE_SHA=$(git rev-parse HEAD^1)
          export RELEASE_BASE_SHA
          ruby fastlane/release_cli.rb validate

  ci:
    needs: prepare
    uses: ./.github/workflows/android-ci.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    secrets: inherit

  deploy:
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: playstore-upload
      cancel-in-progress: false
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PLAY_STORE_JSON_KEY_PATH: /tmp/play-store-key.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Restore build credentials
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_DEBUG: ${{ secrets.GOOGLE_SERVICES_DEBUG }}
          GOOGLE_SERVICES_RELEASE: ${{ secrets.GOOGLE_SERVICES_RELEASE }}
          NETWORK_SECURITY_CONFIG: ${{ secrets.NETWORK_SECURITY_CONFIG }}
          PLAY_STORE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_KEY }}
        run: |
          printf '%s' "$LOCAL_PROPERTIES" > local.properties
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > neki_key_store.jks
          printf '%s' "$GOOGLE_SERVICES_DEBUG" > app/src/debug/google-services.json
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_RELEASE" > app/src/release/google-services.json
          printf '%s' "$NETWORK_SECURITY_CONFIG" > app/src/main/res/xml/network_security_config.xml
          printf '%s' "$PLAY_STORE_KEY" > "$PLAY_STORE_JSON_KEY_PATH"
      - name: Submit production and create release tag
        run: bundle exec fastlane deploy_production
      - name: Sync develop after release
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop "$RELEASE_SHA"; then
            git push origin "$RELEASE_SHA:refs/heads/develop"
          else
            echo '::notice::develop has new commits; release fast-forward was skipped.'
          fi
      - name: Remove restored credentials
        if: always()
        run: rm -f "$PLAY_STORE_JSON_KEY_PATH" neki_key_store.jks

name: Deploy Firebase

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "배포할 브랜치 또는 커밋 (기본: develop)"
        required: false
        default: "develop"

concurrency:
  group: deploy-firebase-${{ github.event.inputs.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'build-logic/**/*.kt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate local.properties
        run: echo '${{ secrets.LOCAL_PROPERTIES }}' >> ./local.properties

      - name: Restore release keystore
        run: echo '${{ secrets.RELEASE_KEYSTORE_BASE64 }}' | base64 -d > ./neki_key_store.jks

      - name: Generate google-services.json (debug)
        run: echo '${{ secrets.GOOGLE_SERVICES_DEBUG }}' > ./app/src/debug/google-services.json

      - name: Generate network_security_config.xml
        run: echo '${{ secrets.NETWORK_SECURITY_CONFIG }}' > ./app/src/main/res/xml/network_security_config.xml

      - name: Run Fastlane deploy_qa
        env:
          FIREBASE_APP_ID_DEBUG:  ${{ secrets.FIREBASE_APP_ID_DEBUG }}
          FIREBASE_TOKEN:         ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_TESTER_GROUPS: 네키들
          FASTLANE_VERSION_CODE:  ${{ github.run_number }}
        run: bundle exec fastlane deploy_qa

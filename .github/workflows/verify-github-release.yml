name: Verify Release Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PLAY_STORE_JSON_KEY_PATH: /tmp/play-store-key.json
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Test orchestration without publishing
        run: bundle exec ruby fastlane/test/play_release_test.rb
      - name: Parse Fastlane lanes without running a deploy
        run: bundle exec fastlane lanes
      - name: Verify read-only Google Play lifecycle API
        env:
          PLAY_STORE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_KEY }}
        run: |
          printf '%s' "$PLAY_STORE_KEY" > "$PLAY_STORE_JSON_KEY_PATH"
          bundle exec ruby -r ./fastlane/lib/play_release -e '
            play = PlayRelease::Play.new
            %w[production internal].each do |track|
              releases = play.releases(track)
              raise "No releases returned for #{track}" if releases.empty?
              states = releases.map do |release|
                release.fetch("releaseName")
                PlayRelease.version_code(release)
                PlayRelease.state(release)
              end
              puts "#{track}: #{states.uniq.sort.join(", ")}"
            end
          '
      - name: Remove restored credentials
        if: always()
        run: rm -f "$PLAY_STORE_JSON_KEY_PATH"
